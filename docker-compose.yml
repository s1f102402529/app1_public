version: '3.8'

services:
  db:
    image: postgres:15
    container_name: baby_log_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: babylog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: baby_log_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-6-luna}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEMO_ACCOUNTS_ENABLED=${DEMO_ACCOUNTS_ENABLED:-false}
    depends_on:
      - db

volumes:
  postgres_data: